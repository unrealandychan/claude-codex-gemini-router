[package]
name = "claude-codex-gemini-router"
version = "0.2.1"
edition = "2021"
authors = ["Eddie Chan <eddie.chan@connect.ust.hk>"]
description = "Cross-platform (macOS, Windows & Linux) Vertex AI Gemini Router & Notification Bar App for Claude Code & OpenAI Codex"
license = "MIT"
repository = "https://github.com/unrealandychan/claude-codex-gemini-router"

[lib]
name = "claude_codex_gemini_router"
path = "src/lib.rs"

[[bin]]
name = "claude-gemini-router"
path = "src/bin/claude-gemini-router.rs"

[[bin]]
name = "gemini-router-ctl"
path = "src/bin/gemini-router-ctl.rs"

[[bin]]
name = "omarchy-gemini-router-ctl"
path = "src/bin/omarchy-gemini-router-ctl.rs"

[[bin]]
name = "gemini-router-tray"
path = "src/bin/gemini-router-tray.rs"

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
futures-util = "=0.3.34"
http = "=1.5.0"
httparse = "=1.10.1"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_urlencoded = "=0.7.1"
tao = "=0.37.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tray-icon = { version = "=0.25.1", default-features = false, features = ["libappindicator"] }
urlencoding = "=2.1.3"
uuid = { version = "=1.27.0", features = ["v4"] }
wry = "=0.57.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
