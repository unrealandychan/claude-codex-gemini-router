name: Cross-Platform Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: claude-codex-gemini-router-macos-arm64
          - os: windows-latest
            artifact_name: claude-codex-gemini-router-windows-x64
          - os: ubuntu-24.04
            artifact_name: claude-codex-gemini-router-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GTK / WebKitGTK / AppIndicator dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --all-targets

      - name: Run unit and E2E integration tests
        run: cargo test --release

      - name: Package macOS release bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/bin "dist/Gemini ADC Router.app/Contents/MacOS"
          cp target/release/claude-gemini-router dist/bin/
          cp target/release/gemini-router-ctl dist/bin/
          cp target/release/omarchy-gemini-router-ctl dist/bin/
          cp target/release/gemini-router-tray dist/bin/
          cp bin/claude-gemini bin/codex-gemini dist/bin/
          cp scripts/install-macos.sh scripts/uninstall-macos.sh dist/
          cp target/release/gemini-router-tray "dist/Gemini ADC Router.app/Contents/MacOS/gemini-router-tray"
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C dist .

      - name: Package Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bin | Out-Null
          Copy-Item target/release/claude-gemini-router.exe dist/bin/
          Copy-Item target/release/gemini-router-ctl.exe dist/bin/
          Copy-Item target/release/omarchy-gemini-router-ctl.exe dist/bin/
          Copy-Item target/release/gemini-router-tray.exe dist/bin/
          Copy-Item bin/claude-gemini.ps1, bin/claude-gemini.cmd, bin/codex-gemini.ps1, bin/codex-gemini.cmd dist/bin/
          Copy-Item scripts/install-windows.ps1, scripts/uninstall-windows.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package Linux release bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/bin
          cp target/release/claude-gemini-router dist/bin/
          cp target/release/gemini-router-ctl dist/bin/
          cp target/release/omarchy-gemini-router-ctl dist/bin/
          cp target/release/gemini-router-tray dist/bin/
          cp bin/claude-gemini bin/codex-gemini dist/bin/
          cp -r omarchy-plugin dist/
          cp scripts/install.sh scripts/uninstall.sh dist/
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip
